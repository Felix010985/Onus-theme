# ==============================================================================
#  Onus theme for Polybar -- by FelixProfi
# ==============================================================================

[colors]
# Color palette.
background     = #1e1e1e
background-alt = #242424
foreground     = #ffffff
primary        = #333333
alert          = #bf616a
disabled       = #555555

[bar/onus]
# My case is DP-3
monitor = DP-3
# Comment the line if yours is not DP-3

# Geometry: draw panel on bottom
bottom = true

# Geometry: Fixed size panel
width = 100%
height = 25pt
radius = 0

# Color mapping [colors]
background = ${colors.background}
foreground = ${colors.foreground}
# Bottom border: A 2-pixel line to visually separate the bar from i3 windows
border-bottom-size = 2pt
border-bottom-color = ${colors.primary}

# Inner content padding from the bar edges (left and right)
padding-left = 1
padding-right = 1

# Inter-module spacing (distance between blocks of information)
module-margin = 1

# Font: System monospace is used.
# The number 2 after the semicolon sets the Y-axis offset to center the text.
font-0 = monospace;2

# Component layout on the bar:
# Left — workspaces, center — window title, right — sensors and system tray.
modules-left   = i3
modules-center = xwindow
modules-right  = cpu temperature memory date tray

# Pointer behavior when hovering over interactive zones
cursor-click  = pointer
cursor-scroll = ns-resize

# Enable IPC protocol to control the bar via external utilities (i3-msg)
enable-ipc = true

[module/i3]
type = internal/i3

# Restrict workspace display to the current monitor only (DP-3)
pin-workspaces = true
# Allow switching workspaces by scrolling the mouse over the module
scroll-workspace = true

# Active workspace (where the input focus currently is):
label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

# Inactive workspace (running on this monitor, but not in focus):
label-unfocused = %name%
label-unfocused-padding = 1

# Urgent workspace (an application requested attention or threw an error):
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
# Outputs the title of the current window. Limit is 60 characters, then truncated (...)
label = %title:0:60:...%


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.foreground}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.foreground}
label = %percentage_used%%

[module/date]
type = internal/date
interval = 1
# Main format: Hours:Minutes
date = %H:%M
# Alternative format (shown when clicking on the clock): Year-Month-Day
date-alt = %Y-%m-%d %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/temperature]
type = internal/temperature
interval = 1

hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon5/temp1_input

warn-temperature = 85

format = <label>
format-prefix = "TEMP "
format-prefix-foreground = ${colors.foreground}
label = %temperature-c%

format-warn = <label-warn>
format-warn-prefix = "HOT! "
format-warn-prefix-foreground = ${colors.alert}
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}


[module/tray]
type = internal/tray
# Spacing between icons in the system tray
tray-spacing = 8px
# Icon scale relative to the total bar height (60% of 30px)
tray-size = 60%
# Tray background overlay (matches the general bar background)
tray-background = ${colors.background}

[settings]
# Automatically reload the bar when screen configuration changes in xrandr
screenchange-reload = true
# Enable pseudo-transparency support for composite managers
pseudo-transparency = true
